{% load wagtailimages_tags %}
{% if self.is_figure %}
<figure>
  {% if self.link %}
  <a href="{{ self.link }}">
    <img src="src" alt="{{ alt_escaped }}" class="{{ self.width }} {{ self.alignment }}">
  </a>
  {% else %}
    <img src="src" alt="{{ alt_escaped }}" class="{{ self.width }} {{ self.alignment }}">
  {% endif %}
  {% if self.caption%}
    <figcaption>{{ self.caption }}</figcaption>
  {% endif %}
</figure>
{% else %}
  {% if self.link %}
  <a href="{{ self.link }}">
    <img src="src" alt="{{ alt_escaped }}" class="{{ self.width }} {{ self.alignment }}">
  </a>
  {% else %}
    <img src="src" alt="{{ alt_escaped }}" class="{{ self.width }} {{ self.alignment }}">
  {% endif %}
{% endif %}
{% if self.attribution %}
  <div class="attribution">{{ self.attribution }}</div>
{% endif %}
