{% load wagtailimages_tags %}
{% if self.is_figure == "yes" %}
<figure>
  {% if self.link %}
  <a href="{{ self.link }}">
    <img src="{{ self.url }}" alt="{{ alt_escaped }}" >
  </a>
  {% else %}
    <img src="{{ self.url }}" alt="{{ alt_escaped }}" >
  {% endif %}
  {% if self.caption%}
    <figcaption>{{ self.caption }}</figcaption>
  {% endif %}
</figure>
{% else %}
  {% if self.link %}
  <a href="{{ self.link }}">
    <img src="{{ self.url }}" alt="{{ alt_escaped }}" >
  </a>
  {% else %}
    <img src="{{ self.url }}" alt="{{ alt_escaped }}" >
  {% endif %}
{% endif %}
{% if self.attribution %}
  <div class="attribution">{{ self.attribution }}</div>
{% endif %}
