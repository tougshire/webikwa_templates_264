{% load wagtailcore_tags navigation_tags %}
{% get_site_root as site_root %}
<nav>
  <div class="menu">
    <div class="menuitem">
      <a href="{% pageurl site_root %}">Home</a>
    </div>
    {% for menuitem in site_root.get_children.live.in_menu %}
      <div class="menuitem">
          <a href="{% pageurl menuitem %}">{{ menuitem.title }}</a>
	    {% for menuiteml1 in menuitem.get_children.live.in_menu %}
	      <div class="menuiteml1">
		  <a href="{% pageurl menuiteml1 %}">{{ menuiteml1.title }}</a>
	      </div>
	    {% endfor %}
      </div>
    {% endfor %}
  </ul>
</nav>
